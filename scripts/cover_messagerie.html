<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    @page { size: 794px 1123px; margin: 0; }
    :root {
      --c-bg: #f1f0f0;
      --c-accent: #8d7324;
      --c-text: #232220;
      --c-muted: #8b8982;
      --c-mid: #766c4b;
      --c-surface: #ebeae6;
    }
    html, body { margin: 0; padding: 0; width: 794px; height: 1123px; background: var(--c-bg); color: var(--c-text); font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    @media screen {
      html { height: auto; display: flex; justify-content: center; min-height: 100vh; background: #e8e8e8; }
      body { transform-origin: top center; scale: min(1, calc(100vw / 794), calc(100vh / 1123)); margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.3); }
    }
    .cover { width: 794px; height: 1123px; position: relative; box-sizing: border-box; }

    /* Layer 0 - base bg */
    .cover { background: var(--c-bg); }

    /* Layer 1 - grid pattern */
    .grid-bg {
      position: absolute; inset: 0; overflow: hidden; z-index: 1;
    }
    .grid-bg svg { width: 100%; height: 100%; }

    /* Layer 2 - thick anchor line */
    .anchor-line {
      position: absolute;
      left: 95px; /* 0.12 * 794 ≈ 95 */
      top: 112px; /* 0.1 * 1123 ≈ 112 */
      bottom: 112px; /* 0.9 * 1123 ≈ 1011, so bottom = 1123 - 1011 = 112 */
      width: 6pt;
      background: var(--c-mid);
      z-index: 2;
    }

    /* Layer 3 - content */
    .content-zone {
      position: absolute;
      left: 145px; /* 95 + 50, gap > 1U(40px) */
      right: 60px;
      top: 0;
      bottom: 0;
      z-index: 3;
    }

    .kicker {
      position: absolute;
      top: 170px; /* 0.15 * 1123 ≈ 168 */
      font-size: 10pt;
      font-weight: 500;
      letter-spacing: 3pt;
      text-transform: uppercase;
      color: var(--c-muted);
      opacity: 0.6;
      font-family: 'Inter', sans-serif;
    }

    .hero-title {
      position: absolute;
      top: 337px; /* 0.30 * 1123 ≈ 337 */
      font-size: 42pt;
      font-weight: 900;
      line-height: 1.15;
      color: var(--c-text);
      max-width: 560px;
      font-family: 'Playfair Display', serif;
    }

    .summary {
      position: absolute;
      top: 562px; /* 0.50 * 1123 ≈ 562 */
      font-size: 12pt;
      font-weight: 400;
      line-height: 1.6;
      color: var(--c-muted);
      opacity: 0.85;
      max-width: 480px;
    }

    .meta {
      position: absolute;
      top: 842px; /* 0.75 * 1123 ≈ 842 */
      font-size: 11pt;
      font-weight: 400;
      color: var(--c-text);
      line-height: 1.6;
    }
    .meta span { display: block; }

    .footer-line {
      position: absolute;
      bottom: 76px;
      left: 0;
      right: 0;
      font-size: 9pt;
      font-weight: 500;
      letter-spacing: 2pt;
      text-transform: uppercase;
      color: var(--c-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="cover">
    <!-- Layer 1: Grid background -->
    <div class="grid-bg">
      <svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123">
        <defs>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#766c4b" stroke-width="0.5" opacity="0.04"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
      </svg>
    </div>

    <!-- Layer 2: Anchor line -->
    <div class="anchor-line"></div>

    <!-- Layer 3: Content -->
    <div class="content-zone">
      <div class="kicker">Etude fonctionnelle</div>
      <div class="hero-title">Messagerie Interne</div>
      <div class="summary">
        Analyse de l'utilite d'un systeme de messagerie integre pour la plateforme PRODESK Congo, comparee aux solutions existantes sur le marche des helpdesks et ERP collaboratifs.
      </div>
      <div class="meta">
        <span>PRODESK Congo — CoursierB2B</span>
        <span>Aout 2026</span>
      </div>
      <div class="footer-line">Document confidentiel</div>
    </div>
  </div>
</body>
</html>
